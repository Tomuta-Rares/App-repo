name: App CI

on:
  push:

jobs:
  fast-validation:
    name: Fast Validation

    runs-on: ubuntu-latest

    steps:
      - name: Checkout app repository
        uses: actions/checkout@v4

      - name: Set up Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Python runtime
        run: |
          python --version
          pip --version

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify application dependencies
        run: |
          python -c "import fastapi; print(f'FastAPI: {fastapi.__version__}')"
          python -c "import sqlalchemy; print(f'SQLAlchemy: {sqlalchemy.__version__}')"

      - name: Verify development tools
        run: |
          ruff --version
          pytest --version
          coverage --version

      - name: Validate Python syntax
        run: |
          python -m compileall .

      - name: Check Python formatting
        run: |
          ruff format --check .

      - name: Run lint
        run: |
          ruff check .

      - name: Run tests with coverage
        run: |
          mkdir -p test-results coverage
          python -m pytest \
            --cov=main \
            --cov=auth \
            --cov-report=term-missing \
            --cov-report=xml:coverage/coverage.xml \
            --junitxml=test-results/junit.xml

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-validation-reports
          path: |
            test-results/
            coverage/
          if-no-files-found: warn

      - name: Run dependency security scan
        run: |
          mkdir -p dependency-security

          pip-audit \
            --requirement requirements.txt \
            --format json \
            --output dependency-security/pip-audit.json

      - name: Upload dependency scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-report
          path: dependency-security/
          if-no-files-found: warn

  build:
    name: Build Container Images
    needs: fast-validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app repository
        uses: actions/checkout@v4

      - name: Verify Docker runtime
        run: |
          docker version
          docker buildx version

      - name: Build backend image
        run: |
          docker build \
            --tag shopping-backend:ci \
            .

      - name: Build frontend image
        run: |
          docker build \
            --tag shopping-frontend:ci \
            ./frontend

      - name: Verify built images
        run: |
          docker image inspect shopping-backend:ci
          docker image inspect shopping-frontend:ci


      - name: Start backend container
        run: |
          docker run -d \
            --name shopping-backend-ci \
            -p 8000:8000 \
            -e DATABASE_URL="sqlite:///./ci-test.db" \
            -e KEYCLOAK_ISSUER="https://auth.test/realms/devops-lvlup" \
            -e KEYCLOAK_JWKS_URL="https://auth.test/realms/devops-lvlup/protocol/openid-connect/certs" \
            shopping-backend:ci

      - name: Wait for backend readiness
        run: |
          for attempt in {1..15}; do
            if curl --fail --silent http://localhost:8000/api/health; then
              echo
              echo "Backend is ready."
              exit 0
            fi

            echo "Attempt ${attempt}/15: backend is not ready yet."
            sleep 2
          done

          echo "Backend did not become ready."
          exit 1
    
      - name: Start frontend container
        run: |
          docker run -d \
            --name shopping-frontend-ci \
            -p 8080:80 \
            shopping-frontend:ci

      - name: Verify frontend response
        run: |
          for attempt in {1..10}; do
            if curl --fail --silent http://localhost:8080/ > /dev/null; then
              echo "Frontend is ready."
              exit 0
            fi

            echo "Attempt ${attempt}/10: frontend is not ready yet."
            sleep 2
          done

          echo "Frontend did not become ready."
          exit 1

      - name: Collect container logs
        if: always()
        run: |
          mkdir -p container-logs

          docker logs shopping-backend-ci \
            > container-logs/backend.log 2>&1 || true

          docker logs shopping-frontend-ci \
            > container-logs/frontend.log 2>&1 || true

      - name: Upload container test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-startup-reports
          path: container-logs/
          if-no-files-found: warn

      - name: Stop test containers
        if: always()
        run: |
          docker rm -f shopping-backend-ci || true
          docker rm -f shopping-frontend-ci || true

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: "v0.72.0"
      
      - name: Verify Trivy runtime
        run: |
          trivy --version

      - name: Scan backend image
        run: |
          mkdir -p security-reports

          trivy image \
            --severity HIGH,CRITICAL \
            --format table \
            --output security-reports/backend-trivy.txt \
            shopping-backend:ci

      - name: Scan frontend image
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --format table \
            --output security-reports/frontend-trivy.txt \
            shopping-frontend:ci

      - name: Enforce critical vulnerability gate
        run: |
          trivy image \
            --severity CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            shopping-backend:ci

          trivy image \
            --severity CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            shopping-frontend:ci

      - name: Display security scan summary
        if: always()
        run: |
          echo "===== Backend image scan ====="
          cat security-reports/backend-trivy.txt || true

          echo
          echo "===== Frontend image scan ====="
          cat security-reports/frontend-trivy.txt || true

      - name: Upload security scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-security-reports
          path: security-reports/
          if-no-files-found: warn

      - name: Export validated container images
        run: |
          mkdir -p image-artifacts

          docker save \
            shopping-backend:ci \
            shopping-frontend:ci \
            | gzip > image-artifacts/container-images.tar.gz

      - name: Verify exported image artifact
        run: |
          ls -lh image-artifacts/container-images.tar.gz
          gzip --test image-artifacts/container-images.tar.gz

      - name: Upload validated container images
        uses: actions/upload-artifact@v4
        with:
          name: validated-container-images
          path: image-artifacts/container-images.tar.gz
          if-no-files-found: error
          retention-days: 1

  push-images:
    name: Push Container Images
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/shopping-backend
      FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/shopping-frontend

    steps:
      - name: Download validated container images
        uses: actions/download-artifact@v4
        with:
          name: validated-container-images
          path: image-artifacts

      - name: Verify downloaded artifact
        run: |
          ls -lh image-artifacts/container-images.tar.gz
          gzip --test image-artifacts/container-images.tar.gz

      - name: Load validated container images
        run: |
          gunzip --stdout image-artifacts/container-images.tar.gz \
            | docker load

      - name: Verify loaded images
        run: |
          docker image inspect shopping-backend:ci
          docker image inspect shopping-frontend:ci

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag validated images
        run: |
          docker tag \
            shopping-backend:ci \
            "${BACKEND_IMAGE}:${GITHUB_SHA}"

          docker tag \
            shopping-frontend:ci \
            "${FRONTEND_IMAGE}:${GITHUB_SHA}"

      - name: Push validated images
        run: |
          docker push "${BACKEND_IMAGE}:${GITHUB_SHA}"
          docker push "${FRONTEND_IMAGE}:${GITHUB_SHA}"

      - name: Verify published images
        run: |
          docker buildx imagetools inspect \
            "${BACKEND_IMAGE}:${GITHUB_SHA}"

          docker buildx imagetools inspect \
            "${FRONTEND_IMAGE}:${GITHUB_SHA}"

  commit-back:
    name: Update Infra Repository
    needs: push-images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout infrastructure repository
        uses: actions/checkout@v4
        with:
          repository: Tomuta-Rares/Infra-repo
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra-repo

      - name: Verify infrastructure repository
        run: |
          git -C infra-repo remote -v
          test -f infra-repo/helm-charts/shopping-stack/charts/shopping-app/values.yaml

      - name: Install yq
        run: |
          sudo wget \
            --output-document=/usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.47.1/yq_linux_amd64

          sudo chmod +x /usr/local/bin/yq

      - name: Verify yq
        run: |
          yq --version

      - name: Update image tags
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          VALUES_FILE="infra-repo/helm-charts/shopping-stack/charts/shopping-app/values.yaml"

          yq -i '.image.tag = strenv(IMAGE_TAG)' "${VALUES_FILE}"
          yq -i '.frontend.image.tag = strenv(IMAGE_TAG)' "${VALUES_FILE}"

      - name: Verify desired state update
        run: |
          VALUES_FILE="infra-repo/helm-charts/shopping-stack/charts/shopping-app/values.yaml"

          echo "Backend image:"
          yq '.image.repository + ":" + .image.tag' "${VALUES_FILE}"

          echo "Frontend image:"
          yq '.frontend.image.repository + ":" + .frontend.image.tag' "${VALUES_FILE}"

          git -C infra-repo diff -- "${VALUES_FILE#infra-repo/}"

      - name: Commit and push desired state
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd infra-repo

          if git diff --quiet; then
            echo "Infrastructure repository already uses image tag ${IMAGE_TAG}."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm-charts/shopping-stack/charts/shopping-app/values.yaml

          git commit \
            -m "chore(deploy): update shopping images to ${IMAGE_TAG}"

          git push

  deployment-verification:
    name: Verify Kubernetes Deployment
    needs: commit-back
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS authentication
        run: |
          aws sts get-caller-identity

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.35.0"

      - name: Verify kubectl runtime
        run: |
          kubectl version --client

      - name: Configure EKS kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name dev-shopping-eks \
            --region "${{ secrets.AWS_REGION }}"

      - name: Verify Kubernetes context
        run: |
          kubectl config current-context
          kubectl get nodes

      - name: Verify target deployment exists
        run: |
          kubectl get deployment shopping-stack-aws \
            --namespace default

      - name: Wait for ArgoCD to apply the new image
        env:
          EXPECTED_IMAGE_TAG: ${{ github.sha }}
        run: |
          for attempt in {1..30}; do
            DEPLOYED_IMAGE="$(
              kubectl get deployment shopping-stack-aws \
                --namespace default \
                --output jsonpath='{.spec.template.spec.containers[0].image}'
            )"

            echo "Attempt ${attempt}/30"
            echo "Expected tag: ${EXPECTED_IMAGE_TAG}"
            echo "Current image: ${DEPLOYED_IMAGE}"

            if [[ "${DEPLOYED_IMAGE}" == *":${EXPECTED_IMAGE_TAG}" ]]; then
              echo "ArgoCD applied the expected image."
              exit 0
            fi

            sleep 10
          done

          echo "ArgoCD did not apply image tag ${EXPECTED_IMAGE_TAG} in time."
          exit 1

      - name: Wait for backend deployment rollout
        run: |
          kubectl rollout status \
            deployment/shopping-stack-aws \
            --namespace default \
            --timeout=5m

      - name: Display backend deployment state
        if: always()
        run: |
          kubectl get deployment shopping-stack-aws \
            --namespace default \
            --output wide || true

          kubectl get pods \
            --namespace default \
            --selector app.kubernetes.io/instance=shopping-stack-aws \
            --output wide || true

  smoke-tests:
    name: Run Deployment Smoke Tests
    needs: deployment-verification
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS authentication
        run: |
          aws sts get-caller-identity

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.35.0"

      - name: Verify kubectl runtime
        run: |
          kubectl version --client

      - name: Configure EKS kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name dev-shopping-eks \
            --region "${{ secrets.AWS_REGION }}"

      - name: Verify cluster connectivity
        run: |
          kubectl config current-context
          kubectl get nodes

      - name: Discover ingress load balancer
        id: ingress
        run: |
          LOAD_BALANCER_HOST="$(
            kubectl get ingress shopping-stack-aws-ingress \
              --namespace default \
              --output jsonpath='{.status.loadBalancer.ingress[0].hostname}'
          )"

          if [[ -z "${LOAD_BALANCER_HOST}" ]]; then
            echo "Ingress load balancer hostname is missing."

            kubectl get ingress shopping-stack-aws-ingress \
              --namespace default \
              --output wide

            exit 1
          fi

          echo "Load balancer: ${LOAD_BALANCER_HOST}"
          echo "host=${LOAD_BALANCER_HOST}" >> "${GITHUB_OUTPUT}"

      - name: Smoke test backend health
        run: |
          RESPONSE="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --insecure \
              --connect-timeout 5 \
              --max-time 20 \
              --connect-to \
                "shopping.local:443:${{ steps.ingress.outputs.host }}:443" \
              "https://shopping.local/api/health"
          )"

          echo "Backend response: ${RESPONSE}"

          if [[ "${RESPONSE}" != *'"status":"healthy"'* ]]; then
            echo "Backend health response is unexpected."
            exit 1
          fi

          echo "Backend health smoke test passed."

      - name: Smoke test frontend
        run: |
          HTTP_STATUS="$(
            curl \
              --silent \
              --show-error \
              --insecure \
              --connect-timeout 5 \
              --max-time 20 \
              --output /dev/null \
              --write-out "%{http_code}" \
              --connect-to \
                "shopping.local:443:${{ steps.ingress.outputs.host }}:443" \
              "https://shopping.local/"
          )"

          echo "Frontend returned HTTP ${HTTP_STATUS}."

          if [[ "${HTTP_STATUS}" != "200" ]]; then
            echo "Expected HTTP 200 from frontend."
            exit 1
          fi

          echo "Frontend smoke test passed."

      - name: Verify items endpoint is protected
        run: |
          HTTP_STATUS="$(
            curl \
              --silent \
              --show-error \
              --insecure \
              --connect-timeout 5 \
              --max-time 20 \
              --output /dev/null \
              --write-out "%{http_code}" \
              --connect-to \
                "shopping.local:443:${{ steps.ingress.outputs.host }}:443" \
              "https://shopping.local/api/items"
          )"

          echo "Items endpoint returned HTTP ${HTTP_STATUS}."

          if [[ "${HTTP_STATUS}" != "401" ]]; then
            echo "Expected HTTP 401 from the protected items endpoint."
            exit 1
          fi

          echo "Items endpoint authentication smoke test passed."


  functional-tests:
    name: Run API Functional Tests
    needs: smoke-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      APP_HOST: shopping.local
      AUTH_HOST: auth.local
      KEYCLOAK_REALM: devops-lvlup
      KEYCLOAK_CLIENT_ID: shopping-frontend
      BOB_USERNAME: bob
      ALICE_USERNAME: alice

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.35.0"

      - name: Configure EKS kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name dev-shopping-eks \
            --region "${{ secrets.AWS_REGION }}"

      - name: Verify required tools
        run: |
          kubectl version --client
          curl --version
          jq --version

      - name: Discover ingress load balancer
        id: ingress
        run: |
          LOAD_BALANCER_HOST="$(
            kubectl get ingress shopping-stack-aws-ingress \
              --namespace default \
              --output jsonpath='{.status.loadBalancer.ingress[0].hostname}'
          )"

          if [[ -z "${LOAD_BALANCER_HOST}" ]]; then
            echo "Ingress load balancer hostname is missing."
            exit 1
          fi

          echo "Load balancer: ${LOAD_BALANCER_HOST}"
          echo "host=${LOAD_BALANCER_HOST}" >> "${GITHUB_OUTPUT}"

      - name: Obtain Keycloak access tokens
        env:
          LOAD_BALANCER_HOST: ${{ steps.ingress.outputs.host }}
          BOB_PASSWORD: ${{ secrets.KEYCLOAK_BOB_PASSWORD }}
          ALICE_PASSWORD: ${{ secrets.KEYCLOAK_ALICE_PASSWORD }}
        run: |
          TOKEN_URL="https://${AUTH_HOST}/auth/realms/${KEYCLOAK_REALM}/protocol/openid-connect/token"

          BOB_TOKEN="$(
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --insecure \
              --connect-timeout 5 \
              --max-time 20 \
              --connect-to \
                "${AUTH_HOST}:443:${LOAD_BALANCER_HOST}:443" \
              --header "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "grant_type=password" \
              --data-urlencode "client_id=${KEYCLOAK_CLIENT_ID}" \
              --data-urlencode "username=${BOB_USERNAME}" \
              --data-urlencode "password=${BOB_PASSWORD}" \
              "${TOKEN_URL}" \
            | jq --raw-output --exit-status '.access_token'
          )"

          ALICE_TOKEN="$(
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --insecure \
              --connect-timeout 5 \
              --max-time 20 \
              --connect-to \
                "${AUTH_HOST}:443:${LOAD_BALANCER_HOST}:443" \
              --header "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "grant_type=password" \
              --data-urlencode "client_id=${KEYCLOAK_CLIENT_ID}" \
              --data-urlencode "username=${ALICE_USERNAME}" \
              --data-urlencode "password=${ALICE_PASSWORD}" \
              "${TOKEN_URL}" \
            | jq --raw-output --exit-status '.access_token'
          )"

          echo "::add-mask::${BOB_TOKEN}"
          echo "::add-mask::${ALICE_TOKEN}"

          echo "BOB_TOKEN=${BOB_TOKEN}" >> "${GITHUB_ENV}"
          echo "ALICE_TOKEN=${ALICE_TOKEN}" >> "${GITHUB_ENV}"

          echo "Keycloak access tokens obtained successfully."

      - name: Functional test GET items
        env:
          LOAD_BALANCER_HOST: ${{ steps.ingress.outputs.host }}
        run: |
          RESPONSE_FILE="$(mktemp)"
          trap 'rm -f "${RESPONSE_FILE}"' EXIT

          HTTP_STATUS="$(
            curl \
              --silent \
              --show-error \
              --insecure \
              --connect-timeout 5 \
              --max-time 20 \
              --output "${RESPONSE_FILE}" \
              --write-out "%{http_code}" \
              --connect-to \
                "${APP_HOST}:443:${LOAD_BALANCER_HOST}:443" \
              --header "Authorization: Bearer ${BOB_TOKEN}" \
              "https://${APP_HOST}/api/items"
          )"

          echo "GET /api/items returned HTTP ${HTTP_STATUS}."

          if [[ "${HTTP_STATUS}" != "200" ]]; then
            echo "Expected HTTP 200."
            cat "${RESPONSE_FILE}"
            exit 1
          fi

          jq --exit-status '
            .message == "items fetched successfully"
            and (.items | type == "array")
            and (.user == "bob")
            and (.roles | index("reader") != null)
          ' "${RESPONSE_FILE}" > /dev/null

          echo "GET /api/items status and payload are valid."

      - name: Functional test POST item
        id: create-item
        env:
          LOAD_BALANCER_HOST: ${{ steps.ingress.outputs.host }}
        run: |
          RESPONSE_FILE="$(mktemp)"
          trap 'rm -f "${RESPONSE_FILE}"' EXIT

          ITEM_NAME="ci-item-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          HTTP_STATUS="$(
            curl \
              --silent \
              --show-error \
              --insecure \
              --connect-timeout 5 \
              --max-time 20 \
              --output "${RESPONSE_FILE}" \
              --write-out "%{http_code}" \
              --connect-to \
                "${APP_HOST}:443:${LOAD_BALANCER_HOST}:443" \
              --request POST \
              --header "Authorization: Bearer ${ALICE_TOKEN}" \
              --header "Content-Type: application/json" \
              --data "{\"name\":\"${ITEM_NAME}\"}" \
              "https://${APP_HOST}/api/items"
          )"

          echo "POST /api/items returned HTTP ${HTTP_STATUS}."

          if [[ "${HTTP_STATUS}" != "201" ]]; then
            echo "Expected HTTP 201."
            cat "${RESPONSE_FILE}"
            exit 1
          fi

          jq --exit-status \
            --arg expected_name "${ITEM_NAME}" \
            '
              .message == "item created"
              and .item.name == $expected_name
              and (.item.id | type == "number")
              and .user == "alice"
              and (.roles | index("writer") != null)
            ' \
            "${RESPONSE_FILE}" > /dev/null

          CREATED_ITEM_ID="$(jq --raw-output '.item.id' "${RESPONSE_FILE}")"

          echo "Created item ID: ${CREATED_ITEM_ID}"
          echo "Created item name: ${ITEM_NAME}"

          echo "item_name=${ITEM_NAME}" >> "${GITHUB_OUTPUT}"
          echo "item_id=${CREATED_ITEM_ID}" >> "${GITHUB_OUTPUT}"

          echo "POST /api/items status and payload are valid."

      - name: Verify created item with GET
        env:
          LOAD_BALANCER_HOST: ${{ steps.ingress.outputs.host }}
          EXPECTED_ITEM_NAME: ${{ steps.create-item.outputs.item_name }}
        run: |
          RESPONSE_FILE="$(mktemp)"
          trap 'rm -f "${RESPONSE_FILE}"' EXIT

          HTTP_STATUS="$(
            curl \
              --silent \
              --show-error \
              --insecure \
              --connect-timeout 5 \
              --max-time 20 \
              --output "${RESPONSE_FILE}" \
              --write-out "%{http_code}" \
              --connect-to \
                "${APP_HOST}:443:${LOAD_BALANCER_HOST}:443" \
              --header "Authorization: Bearer ${BOB_TOKEN}" \
              "https://${APP_HOST}/api/items"
          )"

          echo "GET /api/items returned HTTP ${HTTP_STATUS}."

          if [[ "${HTTP_STATUS}" != "200" ]]; then
            echo "Expected HTTP 200."
            cat "${RESPONSE_FILE}"
            exit 1
          fi

          jq --exit-status \
            --arg expected_name "${EXPECTED_ITEM_NAME}" \
            '
              any(.items[]; .name == $expected_name)
            ' \
            "${RESPONSE_FILE}" > /dev/null

          echo "Created item was found in the GET /api/items response."
          echo "API functional tests passed."